<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام مراقبة حركة الأصناف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              primary: {
                50: 'var(--primary-50)',
                100: 'var(--primary-100)',
                200: 'var(--primary-200)',
                300: 'var(--primary-300)',
                400: 'var(--primary-400)',
                500: 'var(--primary-500)',
                600: 'var(--primary-600)',
                700: 'var(--primary-700)',
                800: 'var(--primary-800)',
                900: 'var(--primary-900)',
                950: 'var(--primary-950)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary-50: #eff6ff;
        --primary-100: #dbeafe;
        --primary-200: #bfdbfe;
        --primary-300: #93c5fd;
        --primary-400: #60a5fa;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
        --primary-800: #1e40af;
        --primary-900: #1e3a8a;
        --primary-950: #172554;
      }
      body {
        font-family: 'Tajawal', sans-serif;
        font-size: 105%;
      }
      @media print {
        body {
          background-color: white !important;
          font-size: 10pt;
          color: black;
        }
        header, footer, .print-hide {
          display: none !important;
        }
        main {
          padding: 0 !important;
          margin: 0.5cm;
        }
        .print-show {
          display: block !important;
        }
        .print-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #333;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .print-header img {
            max-height: 80px;
            width: auto;
        }
        .print-header-info {
            text-align: right;
        }
        .print-header-info h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1d4ed8;
            margin: 0;
        }
        .print-header-info p {
            font-size: 0.9rem;
            margin: 0;
            white-space: pre-wrap;
        }
        .overflow-x-auto {
          overflow-x: visible !important;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 9pt;
        }
        th, td {
          border: 1px solid #ccc;
          padding: 6px;
          text-align: right;
        }
        thead {
          background-color: #f2f2f2;
          color: black;
          display: table-header-group; /* Ensure header repeats on each page */
        }
        .bg-white.dark\:bg-gray-800.rounded-lg.shadow.p-6 {
          box-shadow: none !important;
          padding: 0 !important;
          border: none !important;
          border-radius: 0 !important;
          background-color: transparent !important;
        }
        tr {
          page-break-inside: avoid;
        }
        .status-badge-print {
           padding: 2px 5px;
           border-radius: 9999px;
           font-weight: 500;
           border: 1px solid #ddd;
           background-color: transparent !important; /* Remove background for printing */
           color: black !important; /* Ensure text is visible */
        }
        .print-full-text {
            white-space: normal !important;
            word-break: break-word !important;
            max-width: none !important;
            overflow: visible !important;
        }
        /* Styles for printing single item from modal */
        body.printing-modal-item .fixed.inset-0 {
            position: absolute !important;
            background-color: transparent !important;
        }
        body.printing-modal-item .bg-white {
            box-shadow: none !important;
            border: none !important;
        }
         body.printing-modal-item .print-hide-in-modal {
            display: none !important;
        }
        body.printing-modal-item .print-show {
            display: none !important;
        }
        .print-full-width {
            grid-column: 1 / -1 !important;
        }
        .print-no-gap {
            gap: 0 !important;
        }
        .print-as-block {
            display: block !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
